name: Deploy to Cloudflare Pages

# The Pages project was created by direct upload, so it has no Git provider
# attached — the live site only changed when someone remembered to run
# `wrangler pages deploy` from their own machine. That is why smoald.com sat
# two months behind this repository.
#
# Converting the project to a Git-connected one would mean recreating it, and
# the custom domains hang off the existing project. So instead this runs the
# same deploy command the developer would, on every push to main.
#
# One-time setup — repository Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   709dfa1ba244a9d4e780015aa4ea426c
#
# Until those exist the job fails loudly, which is the right failure: a silent
# no-op would put us straight back to a site drifting out of date.

on:
  push:
    branches: [main]
  workflow_dispatch: # so a deploy can be re-run by hand from the Actions tab

# A newer push should win rather than race an in-flight deploy.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build-free deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Stage only the files that belong on the public site
        # The repo root used to ship as-is, which published every working file:
        # notes, scripts, the workflow, the dev journal. `.assetsignore` does
        # not apply to `wrangler pages deploy` — it is a Workers Assets
        # feature, and wrangler uploaded all 90 files anyway. So the exclusion
        # happens here instead, where it is visible and cannot be ignored.
        #
        # rsync reads the same .assetsignore, so the list lives in one place.
        run: |
          mkdir -p .deploy
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.deploy' \
            --exclude-from='.assetsignore' \
            ./ .deploy/
          echo "Staged for deploy:"
          find .deploy -type f | sort | sed 's/^/  /'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The site is static — nothing to build. `.deploy/` is the staged
          # copy from the previous step; `functions/` inside it is picked up
          # automatically as Pages Functions.
          command: pages deploy .deploy --project-name=smoald --branch=main

      - name: Confirm the new build is actually being served
        run: |
          echo "Waiting for the deployment to propagate…"
          for i in $(seq 1 10); do
            body=$(curl -s --max-time 20 "https://smoald.com/?cachebust=$RANDOM")
            if echo "$body" | grep -q "Lichfield"; then
              echo "✅ smoald.com is serving the new build."
              exit 0
            fi
            echo "  attempt $i: old build still served, waiting 15s"
            sleep 15
          done
          echo "::warning::smoald.com did not show the new build within ~2.5 minutes."
          echo "The deploy may still be propagating — check https://smoald.com by hand."
